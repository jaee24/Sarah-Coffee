<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SENJA — Kasir POS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,500;1,9..144,600&family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="db.js"></script>
<style>
/* CSS khusus KASIR (CSS bersama disuntikkan db.js) */
.ab-row{display:flex;align-items:center;gap:10px;padding:8px 2px;border-bottom:1px dashed var(--line);font-size:13px;flex-wrap:wrap}
.ab-row:last-child{border-bottom:0}
.ab-who{display:flex;align-items:center;gap:9px;flex:1;min-width:150px}
.ab-who b{font-size:13px}
.kbar{position:sticky;top:0;z-index:50;background:color-mix(in srgb,var(--bg) 86%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:16px;padding:0 22px;height:58px}
.k-brand{font-size:21px;font-weight:700;letter-spacing:1.5px;font-family:'Fraunces'}
.k-brand span{font-size:10px;letter-spacing:2.5px;color:var(--acc);margin-left:6px;vertical-align:middle;font-family:'Space Grotesk'}
.k-tabs{display:flex;gap:4px;flex:1;overflow-x:auto}
.k-tab{padding:8px 13px;border-radius:10px;font-size:13px;font-weight:600;color:var(--ink2);cursor:pointer;border:0;background:none;display:flex;align-items:center;gap:7px;position:relative;white-space:nowrap;transition:.15s}
.k-tab:hover{color:var(--acc)}
.k-tab.on{background:var(--acc-soft);color:var(--acc)}
.k-tab .n{position:absolute;top:0;right:2px;background:var(--acc);color:var(--acc-c);font-size:10px;min-width:16px;height:16px;border-radius:8px;display:flex;align-items:center;justify-content:center;padding:0 4px;font-weight:700}
.k-tab .n:empty{display:none}
.k-right{display:flex;align-items:center;gap:12px}
.k-clock{font-family:'IBM Plex Mono';font-size:13px;color:var(--mut);font-weight:500}
.k-user{display:flex;align-items:center;gap:8px}
.k-uin b{display:block;font-size:12px;line-height:1.1}.k-uin span{font-size:10.5px;color:var(--mut)}
.kmain{padding:20px 22px 70px;max-width:1280px;margin:0 auto;width:100%}
@media(max-width:760px){.k-clock,.k-uin{display:none}.kmain{padding:14px 12px 60px}}
.pos{display:grid;grid-template-columns:1fr 350px;gap:18px;align-items:start}
.pos-tools{display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap;align-items:center}
.pos-tools .chips{flex:1}
.pos-tools .search{max-width:280px;min-width:180px}
.pos-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(146px,1fr));gap:12px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;text-align:left;cursor:pointer;transition:.16s;padding:0}
.tile:hover{transform:translateY(-2px);border-color:var(--acc);box-shadow:var(--shadow)}
.tile-img{position:relative;aspect-ratio:4/3;background:var(--acc-soft)}
.tile-img img{width:100%;height:100%;object-fit:cover;display:block}
.tile-img svg{position:absolute;right:6px;bottom:6px;background:rgba(24,16,8,.55);color:#fff;border-radius:6px;padding:3px}
.tile-n{font-size:12.5px;font-weight:600;padding:8px 10px 2px;line-height:1.3}
.tile-p{font-size:12.5px;color:var(--acc);font-weight:700;padding:2px 10px 10px}
.pos-cart{background:var(--side);color:#EFE4D2;border-radius:16px;position:sticky;top:70px;display:flex;flex-direction:column;max-height:calc(100vh - 86px)}
.pc-h{display:flex;align-items:center;gap:8px;padding:14px 16px;border-bottom:1px solid rgba(242,231,214,.1)}
.pc-h b{font-size:15px;font-family:'Fraunces'}
.pc-h span{font-size:11.5px;color:var(--side-mut);flex:1}
.pc-list{flex:1;overflow:auto;padding:10px 12px;display:flex;flex-direction:column;gap:8px;min-height:120px}
.pc-empty{display:flex;flex-direction:column;align-items:center;gap:8px;color:var(--side-mut);padding:36px 10px;font-size:12.5px;text-align:center}
.pc-item{background:rgba(242,231,214,.06);border:1px solid rgba(242,231,214,.08);border-radius:11px;padding:10px 12px;display:flex;justify-content:space-between;gap:8px}
.pc-nm{font-size:12.5px;font-weight:600;line-height:1.25}
.pc-ops{font-size:10.5px;color:#C4B096;margin:3px 0 7px}
.pc-qty{display:inline-flex;align-items:center;gap:10px}
.pc-qty b{font-size:13px}
.pc-qty button{width:22px;height:22px;border-radius:7px;border:1px solid rgba(242,231,214,.22);background:transparent;color:inherit;cursor:pointer;display:flex;align-items:center;justify-content:center}
.pc-qty button:hover{background:rgba(242,231,214,.12)}
.pc-r{text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.pc-st{font-size:13px;font-weight:700}
.pc-acts{display:flex;gap:5px}
.pc-acts button{border:0;background:rgba(242,231,214,.08);color:#C4B096;border-radius:7px;width:24px;height:24px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.pc-acts button:hover{color:#fff;background:rgba(242,231,214,.18)}
.pc-f{padding:14px 16px;border-top:1px solid rgba(242,231,214,.1)}
.pc-sub{display:flex;justify-content:space-between;margin-bottom:11px;font-size:14px}
.pc-sub b{font-size:18px;font-family:'Fraunces'}
@media(max-width:1000px){.pos{grid-template-columns:1fr}.pos-cart{position:static;max-height:none}}
.om-h{display:flex;gap:12px;align-items:center;margin-bottom:16px}
.om-h img{width:62px;height:62px;border-radius:12px;object-fit:cover;border:1px solid var(--line)}
.om-h b{display:block;font-size:15px}.om-h span{font-size:12px;color:var(--mut)}
.om-g{margin-bottom:13px}
.om-g label{display:block;font-size:11px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;color:var(--mut);margin-bottom:6px}
.om-qty{display:inline-flex;align-items:center;gap:14px;border:1.5px solid var(--line);border-radius:11px;padding:7px 12px}
.om-qty b{font-size:16px;min-width:20px;text-align:center}
.om-qty button{border:0;background:var(--acc-soft);color:var(--acc);width:26px;height:26px;border-radius:8px;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:16px}
.om-p{display:flex;justify-content:space-between;align-items:center;padding:12px 2px;font-size:13.5px;color:var(--mut);border-top:1.5px dashed var(--line)}
.om-p b{font-size:19px;color:var(--ink);font-family:'Fraunces'}
.pay{display:grid;grid-template-columns:1.1fr 1fr;gap:16px;align-items:start}
.pay-items{display:flex;flex-direction:column;margin-top:6px}
.pay-it{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px dashed var(--line)}
.pay-it b{font-size:13.5px;font-weight:600}
.pay-it .mut{display:block;font-size:11.5px;margin-top:2px}
.pay-it2{text-align:right;font-size:12px;color:var(--mut);white-space:nowrap}
.pay-it2 b{display:block;color:var(--ink);font-size:13px}
.pay-disc{border-top:1.5px dashed var(--line);margin-top:14px;padding-top:14px}
.pay-disc label{font-size:11.5px;font-weight:700;letter-spacing:.7px;text-transform:uppercase;color:var(--mut);display:block;margin-bottom:7px}
.kd-msg{margin-top:9px;font-size:12.5px;font-weight:600}
.kd-msg .ok{color:var(--ok)}.kd-msg .bad{color:var(--bad)}
.pm-mets{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:8px 0 4px}
.pm-met{display:flex;flex-direction:column;gap:6px;align-items:center;padding:13px 8px;border:1.5px solid var(--line);border-radius:12px;background:transparent;color:var(--ink2);font-weight:600;font-size:12.5px;cursor:pointer;transition:.15s}
.pm-met:hover{border-color:var(--acc)}
.pm-met.on{border-color:var(--acc);background:var(--acc-soft);color:var(--acc)}
.pm-box{margin-top:12px;display:flex;flex-direction:column;gap:9px}
.pm-box label{font-size:11.5px;font-weight:700;letter-spacing:.7px;text-transform:uppercase;color:var(--mut)}
input.big-num{font-size:19px;font-weight:700;text-align:right;font-family:'IBM Plex Mono'}
.pm-k{display:flex;justify-content:space-between;align-items:center;background:var(--acc-soft);border-radius:11px;padding:11px 14px;font-weight:600;font-size:13.5px}
.pm-k b{font-size:18px;font-family:'Fraunces'}
.qris{display:flex;flex-direction:column;align-items:center;gap:10px;padding:6px 0}
.qris canvas{border-radius:12px;border:1px solid var(--line)}
.qris-t{text-align:center;font-size:12.5px;line-height:1.5}
.qris-t span{color:var(--mut);font-size:11.5px}
.pm-tots{border-top:1.5px dashed var(--line);margin-top:14px;padding-top:12px;display:flex;flex-direction:column;gap:7px}
.pm-tots>div{display:flex;justify-content:space-between;font-size:13.5px;color:var(--ink2)}
.pm-grand{font-size:15px;color:var(--ink)!important;align-items:baseline}
.pm-grand b{font-size:26px;font-family:'Fraunces';font-weight:700}
.pm-btns{display:grid;grid-template-columns:1fr 2fr;gap:10px;margin-top:16px}
@media(max-width:900px){.pay{grid-template-columns:1fr}}
.kh-top{display:grid;grid-template-columns:1.25fr 1fr;gap:14px;margin-bottom:14px}
.kh-cols{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:14px}
.kh-me{display:flex;align-items:center;gap:14px;padding:18px;flex-wrap:wrap}
.kh-me>div:nth-child(2){flex:1;min-width:140px}
.kh-me b{display:block;font-size:15px}
.kh-me .mut{font-size:12px}
.kh-sh{display:flex;gap:6px;flex-wrap:wrap;margin-top:7px}
@media(max-width:1000px){.kh-top,.kh-cols{grid-template-columns:1fr}}
.ksh{display:grid;grid-template-columns:1.2fr 1fr;gap:14px}
.ksh-c h3{font-size:19px;margin-bottom:14px}
.ksh-me{display:flex;align-items:center;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.ksh-me>div:nth-child(2){flex:1}
.ksh-me b{display:block;font-size:15px}
.ksh-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:18px}
.ksh-grid span{display:block;font-size:10.5px;letter-spacing:1.1px;text-transform:uppercase;color:var(--mut);font-weight:700;margin-bottom:3px}
.ksh-grid b{font-size:15px}
.ksh-abs{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ksh-ab{border:1.5px solid var(--line);border-radius:13px;padding:13px;display:flex;flex-direction:column;gap:9px;font-size:12px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:var(--mut)}
.ksh-ab .btn{text-transform:none;letter-spacing:0}
.ksh-note{font-size:11.5px;color:var(--mut);margin-top:12px;line-height:1.5}
@media(max-width:860px){.ksh{grid-template-columns:1fr}.ksh-grid,.ksh-abs{grid-template-columns:1fr}}
</style>
</head>
<body data-app="kasir">
<div id="root"></div><div id="modals"></div><div id="toasts"></div><div id="printArea"></div>
<script>
/* ================= APLIKASI KASIR / POS ================= */
let CUR=null;
const S={page:'home'};
const POS={cart:[],metode:'cash',kode:'',disc:null,bayar:'',ref:''};
const POSUI={q:'',kat:'all'};
let OM=null,RIW={q:'',mode:'today',date:today()};
function KPreset(){POS.cart=[];POS.metode='cash';POS.kode='';POS.disc=null;POS.bayar='';POS.ref=''}

/* ---- auth ---- */
function doLogin(e){
  e.preventDefault();
  const u=DB.users.find(x=>x.user_id.toLowerCase()===$('#lgU').value.trim().toLowerCase());
  if(!u||u.password!==$('#lgP').value){$('#lgE').textContent='User ID atau password salah.';return}
  if(u.level!=='kasir'){$('#lgE').textContent='Akun ini level Admin — masuk lewat aplikasi Admin (admin.html).';return}
  setSession('pos',u.user_id);CUR=u;S.page='home';KPreset();POSUI.q='';POSUI.kat='all';render();
  toast(`Selamat datang, ${u.nama.split(' ')[0]}!`);
}
function fillLg(id,pw){$('#lgU').value=id;$('#lgP').value=pw;$('#lgE').textContent=''}
function togPw(){const i=$('#lgP');i.type=i.type==='password'?'text':'password'}
function logout(){clearSession('pos');CUR=null;KPreset();closeAllModals();render()}
function go(p){S.page=p;render();window.scrollTo(0,0)}
function loginView(){
  return `<div class="lg"><div class="lg-card">
    <div class="lg-left">
      <svg class="steam" viewBox="0 0 60 46" fill="none" stroke="#E8DCC8" stroke-width="2.4" stroke-linecap="round">
        <path d="M18 42 C13 34 22 28 17 20 C13 13 19 9 16 3"/>
        <path d="M31 44 C26 35 34 30 29 22 C25 15 31 10 28 4"/>
        <path d="M44 42 C39 34 47 28 42 20 C38 13 44 9 41 3"/>
      </svg>
      <div class="lg-cup">${ic('coffee',46)}</div>
      <div class="lg-word">SENJA</div>
      <div class="lg-tag">Kasir POS — transaksi, pembayaran, struk, riwayat &amp; absensi shift.</div>
      <div class="lg-mini"><b>Dua Aplikasi · Satu Database</b><span>Buka Admin Console di admin.html — data tersinkron otomatis.</span></div>
    </div>
    <form class="lg-right" onsubmit="doLogin(event)">
      <h1 class="fr">Kasir POS</h1>
      <p>Masuk dengan akun level Kasir.</p>
      <div class="field"><label>${t('User ID')}</label><input id="lgU" class="inp" autocomplete="off" placeholder="cth. KSR01"></div>
      <div class="field"><label>${t('Password')}</label>
        <div class="inp-wrap"><input id="lgP" type="password" class="inp" placeholder="••••••••">
        <button type="button" class="eye" onclick="togPw()">${ic('eye',16)}</button></div>
      </div>
      <div class="lg-err" id="lgE"></div>
      <button class="btn btn-acc btn-block" style="margin-top:4px">${ic('logout',16)} ${t('Masuk')}</button>
      <div class="lg-demo"><b>Demo:</b>
        <button type="button" onclick="fillLg('KSR01','kasir123')">KSR01 · kasir123</button>
        <button type="button" onclick="fillLg('KSR02','kasir123')">KSR02 · kasir123</button>
        <a href="admin.html">→ Aplikasi Admin</a>
      </div>
    </form>
  </div></div>`;
}

/* ---- shell & router ---- */
const KTABS=[['home','Home','home'],['transaksi','Transaksi','cart'],['pembayaran','Pembayaran','wallet'],['riwayat','Riwayat','receipt'],['shift','Shift','clock'],['pengaturan','Pengaturan','settings']];
function render(){
  applyTheme();
  const R=$('#root');
  if(!CUR){R.innerHTML=loginView();return}
  const nItems=POS.cart.reduce((a,x)=>a+x.qty,0);
  R.innerHTML=`<div class="kl">
   <header class="kbar">
    <div class="k-brand">SENJA<span>POS</span></div>
    <nav class="k-tabs">${KTABS.map(([p,lb,i])=>`<button class="k-tab ${S.page===p?'on':''}" onclick="go('${p}')">${ic(i,16)}${t(lb)}${p==='pembayaran'?`<span class="n" id="cartN">${nItems>0?nItems:''}</span>`:''}</button>`).join('')}</nav>
    <div class="k-right">
      <span class="k-clock" id="clk">${nowHMS()}</span>
      <div class="k-user"><div class="ava sm">${CUR.nama[0]}</div><div class="k-uin"><b>${esc(CUR.nama.split(' ')[0])}</b><span>Kasir</span></div></div>
      <button class="icon-btn" onclick="logout()" title="Keluar">${ic('logout',15)}</button>
    </div>
   </header>
   <main class="kmain"><div id="view"></div></main></div>`;
  (KASPG[S.page]||KASPG.home)();
}
const KASPG={};
KASPG.pengaturan=settingsView;

/* ---- konteks shift ---- */
function shiftStateOf(jenis){
  const h=new Date().getHours()+new Date().getMinutes()/60;
  const toMin=s=>{const[a,b]=s.split(':').map(Number);return a+b/60};
  const[ms,me]=SHIFT_HOURS[jenis];
  return h<toMin(ms)?'belum':(h<toMin(me)?'berlangsung':'selesai');
}
function shiftNow(){
  const toMin=s=>{const[a,b]=s.split(':').map(Number);return a+b/60};
  const h=new Date().getHours()+new Date().getMinutes()/60;
  const jenis=h<toMin(SHIFT_HOURS.P[1])?'P':'S';
  return{ds:today(),jenis,status:shiftStateOf(jenis)};
}
function shiftCtx(){const c=shiftNow();return{ds:c.ds,jenis:c.jenis,label:SHIFT_LABEL[c.jenis],status:c.status}}

/* ---- HOME ---- */
KASPG.home=function(){
  const t5=bestSellers({limit:5});
  const cKat=DB.kategori.find(k=>k.nama.toLowerCase()==='cemilan');
  const c5=cKat?bestSellers({limit:5,katId:cKat.id}):[];
  const m7=bestSellers({limit:7,jenis:'minuman'});
  const ctx=shiftCtx();
  const myTx=DB.transaksi.filter(x=>x.uid===CUR.user_id&&x.tanggal.startsWith(today()));
  $('#view').innerHTML=`
  <div class="kh-top">
    <div class="card">
      <div class="c-h"><h3 class="fr">${t('Produk Terjual Hari Ini')}</h3><span class="bdg bdg-a">${today()}</span></div>
      <div class="stat-f" style="min-height:80px">
        <div><b class="fr" style="font-size:34px;line-height:1">${num(soldToday())}</b>
        <div class="mut" style="font-size:12px;margin-top:4px">produk terjual · ${rp(myTx.reduce((a,x)=>a+x.total,0))} dari transaksimu</div></div>
        <div class="spark" style="height:48px">${sparkArr().map(v=>`<i style="height:${v}%"></i>`).join('')}</div>
      </div>
    </div>
    <div class="card kh-me">
      <div class="ava lg">${CUR.nama[0]}</div>
      <div><b>${esc(CUR.nama)}</b><span class="mut" style="font-size:12.5px">${CUR.user_id} · Kasir</span>
        <div class="kh-sh">${ctx?`<span class="bdg ${ctx.jenis==='S'?'bdg-w':'bdg-d'}">Shift ${ctx.jenis} · ${ctx.label} ${SHIFT_HOURS[ctx.jenis][0]}–${SHIFT_HOURS[ctx.jenis][1]}</span>`:'<span class="bdg bdg-mut">Belum jam shift</span>'}</div>
      </div>
    </div>
  </div>
  <div class="rc-stack">
    <div class="card"><div class="c-h"><h3 class="fr">Paling Laris — ${t('Semua Kategori')}</h3><span class="bdg bdg-a">Top 5</span></div>${rankList(t5)}</div>
    <div class="card"><div class="c-h"><h3 class="fr">Paling Laris — Cemilan</h3><span class="bdg bdg-w">Top 5</span></div>${rankList(c5)}</div>
    <div class="card"><div class="c-h"><h3 class="fr">Paling Laris — Minuman</h3><span class="bdg bdg-d">Top 7</span></div>${rankList(m7)}</div>
  </div>`;
};

/* ---- TRANSAKSI (POS) ---- */
KASPG.transaksi=function(){
  $('#view').innerHTML=`<div class="pos">
   <div>
    <div class="pos-tools">
      <div class="chips">
        <button class="chip ${POSUI.kat==='all'?'on':''}" onclick="POSUI.kat='all';KASPG.transaksi()">${t('All Items')}</button>
        ${DB.kategori.map(k=>`<button class="chip ${String(POSUI.kat)===String(k.id)?'on':''}" onclick="POSUI.kat='${k.id}';KASPG.transaksi()">${esc(k.nama)}</button>`).join('')}
      </div>
      ${srch(POSUI.q,"POSUI.q=this.value;posGrid()",'Cari menu…')}
    </div>
    <div class="pos-grid" id="posGrid"></div>
   </div>
   <aside class="pos-cart" id="posCart"></aside>
  </div>`;
  posGrid();cartRender();
};

function posGrid(){
  const q=POSUI.q.toLowerCase();
  const list=DB.produk.filter(p=>p.status==='aktif'&&(POSUI.kat==='all'||String(p.kid)===String(POSUI.kat))&&p.nama.toLowerCase().includes(q));
  $('#posGrid').innerHTML=list.length?list.map(p=>`
   <div class="tile" onclick="omOpen('${p.id}')" title="Klik untuk mengatur opsi">
     <div class="tile-img"><img src="${esc(p.gambar)}" loading="lazy" alt="" onerror="this.style.visibility='hidden'">
       <button title="Tambah cepat (opsi standar)"
         style="position:absolute;right:6px;bottom:6px;width:28px;height:28px;border:0;border-radius:9px;background:var(--acc);color:var(--acc-c);display:flex;align-items:center;justify-content:center;cursor:pointer"
         onclick="event.stopPropagation();omQuickAdd('${p.id}')">${ic('plus',15)}</button>
     </div>
     <div class="tile-n">${esc(p.nama)}</div>
     <div class="tile-p">${rp(p.harga)}</div>
   </div>`).join(''):emptyBox('coffee','Menu tidak ditemukan');
}

function cartRender(){
  const sub=POS.cart.reduce((a,x)=>a+x.harga*x.qty,0);
  $('#posCart').innerHTML=`
   <div class="pc-h">${ic('cart',16)}<b>Keranjang</b><span>${POS.cart.length} jenis item</span></div>
   <div class="pc-list">${POS.cart.length?POS.cart.map((x,i)=>`
     <div class="pc-item">
       <div>
         <div class="pc-nm">${esc(x.nama)}</div>
         <div class="pc-ops">${x.opsi.length?esc(x.opsi.join(' · ')):'—'}</div>
         <div class="pc-qty">

/* ---- modal opsi menu: klik 1× langsung terbuka ---- */
let OMD=null;
function omOpen(pid,editIdx=-1){
  const p=prod(pid);if(!p)return;
  const k=kat(p.kid),src=editIdx>=0?POS.cart[editIdx]:null,has=v=>p.opsi.includes(v);
  const inis=src?src.opsi:[];
  const PEN=inis.includes('Cold')?'cold':inis.includes('Hot')?'hot':(p.penyajian.includes('cold')?'cold':p.penyajian.includes('hot')?'hot':'');
  OMD={
    pid,editIdx,
    pen:k.jenis==='minuman'?PEN:'',
    ukr:(has('regular')||has('large'))?(inis.includes('Large')?'large':inis.includes('Regular')?'regular':(has('regular')?'regular':'large')):'',
    ice:(has('less_ice')||has('normal_ice'))?(inis.includes('Less Ice')?'less':inis.includes('Normal Ice')?'normal':(has('normal_ice')?'normal':'less')):'',
    sgr:(has('less_sugar')||has('normal_sugar'))?(inis.includes('Less Sugar')?'less':inis.includes('Normal Sugar')?'normal':(has('normal_sugar')?'normal':'less')):'',
    qty:src?src.qty:1
  };
  openModal(omHTML());
}
function omHTML(){
  const p=prod(OMD.pid),k=kat(p.kid);
  const isDrink=k.jenis==='minuman',cold=OMD.pen==='cold';
  const harga=p.harga+(OMD.ukr==='large'?HARGA_LARGE:0);
  const penOps=[];if(p.penyajian.includes('hot'))penOps.push(['hot','Hot']);if(p.penyajian.includes('cold'))penOps.push(['cold','Cold']);
  const seg=(key,label,opts)=>`<div class="om-g"><label>${label}</label><div class="seg">
    ${opts.map(([v,l])=>`<button class="${OMD[key]===v?'on':''}" onclick="omSet('${key}','${v}')">${l}</button>`).join('')}</div></div>`;
  return `<div class="mform">
   <div class="om-h"><img src="${esc(p.gambar)}" onerror="this.style.visibility='hidden'"><div><b>${esc(p.nama)}</b><span>${esc(k.nama)} · ${rp(p.harga)}</span></div></div>
   ${isDrink?`
     ${penOps.length?seg('pen',t('Penyajian'),penOps):''}
     ${(p.opsi.includes('regular')||p.opsi.includes('large'))?seg('ukr',t('Ukuran'),[['regular','Regular'],['large',`Large +${num(HARGA_LARGE)}`]]):''}
     ${cold&&(p.opsi.includes('less_ice')||p.opsi.includes('normal_ice'))?seg('ice','Es',[['normal','Normal Ice'],['less','Less Ice']]):''}
     ${(p.opsi.includes('less_sugar')||p.opsi.includes('normal_sugar'))?seg('sgr','Gula',[['normal','Normal Sugar'],['less','Less Sugar']]):''}`
   :`<div class="mut" style="font-size:12.5px">${t('Jenis')}: Makanan — tanpa opsi tambahan.</div>`}
   <div class="om-g"><label>${t('Jumlah')}</label>
     <div class="om-qty"><button onclick="omQty(-1)">−</button><b>${OMD.qty}</b><button onclick="omQty(1)">+</button></div></div>
   <div class="om-p"><span>${OMD.editIdx>=0?t('Ubah Item'):t('Tambah ke Keranjang')}</span><b>${rp(harga*OMD.qty)}</b></div>
   <div class="mbtns">
     <button class="btn btn-acc" onclick="omSave()">${OMD.editIdx>=0?t('Ubah Item'):t('Tambah ke Keranjang')}</button>
     <button class="btn btn-line" onclick="closeModal()">${t('Batal')}</button>
   </div></div>`;
}
function omSet(key,val){OMD[key]=val;setModal(omHTML())}
function omQty(d){OMD.qty=Math.max(1,OMD.qty+d);setModal(omHTML())}
function omSave(){
  const p=prod(OMD.pid),k=kat(p.kid),opsi=[];
  if(k.jenis==='minuman'){
    if(OMD.pen)opsi.push(OMD.pen==='cold'?'Cold':'Hot');
    if(OMD.ukr)opsi.push(OMD.ukr==='large'?'Large':'Regular');
    if(OMD.pen==='cold'&&OMD.ice)opsi.push(OMD.ice==='less'?'Less Ice':'Normal Ice');
    if(OMD.sgr)opsi.push(OMD.sgr==='less'?'Less Sugar':'Normal Sugar');
  }
  const harga=p.harga+(OMD.ukr==='large'?HARGA_LARGE:0);
  const line={pid:OMD.pid,nama:p.nama,opsi,harga,qty:OMD.qty};
  if(OMD.editIdx>=0)POS.cart[OMD.editIdx]=line;
  else{
    const i=POS.cart.findIndex(x=>x.pid===line.pid&&x.opsi.join('|')===opsi.join('|'));
    if(i>=0)POS.cart[i].qty+=line.qty;else POS.cart.push(line);
  }
  closeModal();cartRender();
  toast(`${line.nama}${opsi.length?' · '+opsi.join(', '):''} ×${line.qty} masuk keranjang`);
}
function omQuickAdd(pid){
  const p=prod(pid);if(!p)return;
  const k=kat(p.kid),opsi=[];
  if(k.jenis==='minuman'){
    const pen=p.penyajian.includes('cold')?'Cold':(p.penyajian.includes('hot')?'Hot':'');
    if(pen)opsi.push(pen);
    if(p.opsi.includes('regular')||p.opsi.includes('large'))opsi.push('Regular');
    if(pen==='Cold'&&(p.opsi.includes('less_ice')||p.opsi.includes('normal_ice')))opsi.push('Normal Ice');
    if(p.opsi.includes('less_sugar')||p.opsi.includes('normal_sugar'))opsi.push('Normal Sugar');
  }
  const line={pid,nama:p.nama,opsi,harga:p.harga,qty:1};
  const i=POS.cart.findIndex(x=>x.pid===pid&&x.opsi.join('|')===opsi.join('|'));
  if(i>=0)POS.cart[i].qty++;else POS.cart.push(line);
  cartRender();toast(`${p.nama} ditambahkan (opsi standar)`);
}

function payCalc(){
  const tot=payTotal(),bay=pnum(POS.bayar);
  const k=$('#pmK');if(k)k.textContent=bay>0?rp(Math.max(0,bay-tot)):'—';
  const g=$('#pmGo');if(g)g.disabled=(POS.metode==='cash'&&bay<tot);
}
function applyKode(){
  const kode=POS.kode.trim().toUpperCase();
  POS.disc=null;
  if(kode){
    const d=DB.diskon.find(x=>x.kode===kode&&x.status==='aktif'&&today()>=x.mulai&&today()<=x.exp);
    const sub=cartSub();
    if(!d)POS.disc={err:'Kode tidak tersedia / kadaluarsa'};
    else if(sub<d.min)POS.disc={err:`Minimum belanja ${rp(d.min)} untuk kode ini`};
    else POS.disc={d,pot:d.tipe==='persen'?Math.round(sub*d.nilai/100):Math.min(d.nilai,sub)};
  }
  KASPG.pembayaran();
}
function drawQR(cv,seedStr){
  const n=21,s=cv.width/n,ctx=cv.getContext('2d');
  const r=mulberry32([...seedStr].reduce((a,c)=>a+c.charCodeAt(0),0));
  ctx.fillStyle='#fff';ctx.fillRect(0,0,cv.width,cv.height);ctx.fillStyle='#191512';
  const finder=(x,y)=>{for(let i=0;i<7;i++)for(let j=0;j<7;j++){const e=i===0||i===6||j===0||j===6,m=i>=2&&i<=4&&j>=2&&j<=4;if(e||m)ctx.fillRect((x+i)*s,(y+j)*s,s,s)}};
  for(let y=0;y<n;y++)for(let x=0;x<n;x++){
    const inF=(x<8&&y<8)||(x>=n-8&&y<8)||(x<8&&y>=n-8);
    if(!inF&&r()<0.45)ctx.fillRect(x*s,y*s,s,s);
  }
  finder(0,0);finder(n-7,0);finder(0,n-7);
}
function batalPesanan(){
  confirmBox('Batalkan Pesanan','Semua item di keranjang akan dihapus.',()=>{
    KPreset();go('transaksi');toast('Pesanan dibatalkan');

}
function payConfirm(){
  const tot=payTotal();

  openModal(`<div class="cf"><div class="cf-i">${ic('check',24)}</div><h3 class="fr">Apakah pesanan sudah benar?</h3>
   <p>${POS.cart.length} jenis item · Total <b>${rp(tot)}</b> · ${POS.metode.toUpperCase()}</p>

   <button class="btn btn-acc" id="pmYes">${t('Bayar')} &amp; ${t('Cetak Struk')}</button></div></div>`);
  $('#pmYes').onclick=payNow;
}
function payNow(){
  const sub=cartSub(),pot=discPot(),tot=payTotal(),id=nextTxId();
  let dibayar=tot,kembalian=0;
  if(POS.metode==='cash'){dibayar=pnum(POS.bayar)||tot;kembalian=dibayar-tot}
  DB.transaksi.push({id,tanggal:`${today()} ${nowHMS()}`,uid:CUR.user_id,subtotal:sub,diskon:pot,kode:POS.disc&&POS.disc.d?POS.disc.d.kode:'',total:tot,metode:POS.metode,dibayar,kembalian,ref:POS.metode==='debit'?POS.ref:'',status:'selesai'});
  POS.cart.forEach(x=>{
    DB.transaksi_detail.push({tid:id,pid:x.pid,nama:x.nama,opsi:x.opsi.join(' · '),qty:x.qty,harga:x.harga,st:x.harga*x.qty});
    DB.resep.filter(r=>r.pid===x.pid).forEach(r=>{const b=bahan(r.bid);if(b)b.stok=Math.max(0,b.stok-r.jumlah*x.qty)});
  });
  saveDB();
  const tx=DB.transaksi.find(x=>x.id===id);
  KPreset();closeModal();
  openModal(`<div class="rc-wrap">
    <div class="pay-ok">${ic('check',20)} ${t('Transaksi Berhasil')}</div>
    ${receiptHTML(tx)}
    <div class="rc-actions">
      <button class="btn btn-acc" onclick="printReceipt('${id}')">${ic('printer',16)} ${t('Cetak Struk')}</button>
      <button class="btn btn-line" onclick="closeModal();go('transaksi')">${t('Selesai')}</button>
    </div></div>`);
  render();
}

    <div class="row" style="margin-top:12px">
      <button class="btn btn-acc flex1" onclick="absDo('masuk')">${ic('clock',15)} ${t('Absen Masuk')}</button>
      <button class="btn flex1" onclick="absDo('pulang')">${ic('logout',15)} ${t('Absen Pulang')}</button>
    </div>`
    :`<div class="mut" style="font-size:12.5px">Belum ada pegawai yang bisa absen — jadwal shift hari ini kosong.</div>`}
    <div class="ksh-note"><b>Ketentuan Absensi:</b> satu perangkat boleh dipakai bersama anggota shift · setiap pegawai wajib verifikasi dengan akun sendiri · absen masuk hanya 1× per shift — setelah berhasil status berubah menjadi jam masuk, klik berulang tidak mengubahnya · absen pulang hanya bisa setelah check-in dan tombolnya baru aktif di jam pulang shift · absen masuk dibuka 30 menit sebelum jam mulai (P: 09:30, S: 16:00).</div>
  </div>`;
};
function absDo(action){
  const raw=document.getElementById('abUid')?.value||'';
  const[uid,jenis]=raw.split('|');
  const pw=document.getElementById('abPw')?.value;
  if(!uid||!jenis){toast('Belum ada pegawai terjadwal hari ini','bad');return}
  const u=user(uid);
  if(!u||u.password!==pw){toast('Verifikasi gagal — User ID / password salah','bad');return}
  if(!DB.shift.some(s=>s.uid===uid&&s.tanggal===today()&&s.jenis===jenis)){toast('Pegawai ini tidak terjadwal di shift '+jenis+' hari ini','bad');return}
  const rec=DB.absensi.find(a=>a.uid===uid&&a.tanggal===today()&&(a.shift===jenis||!a.shift));
  const[ms,me]=SHIFT_HOURS[jenis];
  const toMin=s=>{const[a,b]=s.split(':').map(Number);return a+b/60};
  const h=new Date().getHours()+new Date().getMinutes()/60;
  if(action==='masuk'){
    if(rec&&rec.masuk){toast(`${u.nama}: absen masuk sudah tercatat ${rec.masuk} — tidak dapat diubah`,'bad');return}
    if(h<toMin(ms)-0.5){toast(`Absen masuk shift ${jenis} baru dibuka pukul ${ms} (30 menit sebelumnya)`,'bad');return}
    if(h>=toMin(me)){toast(`Shift ${jenis} sudah selesai — tidak bisa absen masuk`,'bad');return}
    const masuk=nowT(),status=masuk>ms?'terlambat':'hadir';
    if(rec){rec.masuk=masuk;rec.status=status;rec.shift=jenis}
    else DB.absensi.push({id:nextId(DB.absensi,'ABS-'),uid,tanggal:today(),shift:jenis,masuk,pulang:'',status});
    saveDB();KASPG.shift();toast(`${u.nama} absen masuk ${masuk}${status==='terlambat'?' (terlambat)':''}`);
  }else{
    if(!rec||!rec.masuk){toast('Belum check-in — absen pulang hanya bisa setelah check-in','bad');return}
    if(rec.pulang){toast(`${u.nama}: absen pulang sudah tercatat ${rec.pulang} — tidak dapat diubah`,'bad');return}
    if(h<toMin(me)){toast(`Absen pulang shift ${jenis} baru aktif pukul ${me}`,'bad');return}
    rec.pulang=nowT();saveDB();KASPG.shift();toast(`${u.nama} absen pulang ${rec.pulang}`);
  }
}
/* ---- init ---- */
loadDB();
const _su=getSession('pos');
if(_su){const u=user(_su);if(u&&u.level==='kasir')CUR=u}
window.onSync=()=>{if(CUR)render()};
render();
setInterval(()=>{const c=document.getElementById('clk');if(c)c.textContent=nowHMS()},1000);
setInterval(()=>{if(CUR&&S.page==='shift')KASPG.shift()},60000);
</script>
